name: "\u2705 ALC Benchmark Test Checklist (Console)"
description: Run through ALC Benchmark's Console test checklist and report results
title: '[TEST][Console] '
labels:
- testing
assignees:
- MPHONlC
body:
- type: markdown
  attributes:
    value: Thanks for testing **ALC Benchmark** on Console! Check off everything you actually tested and confirmed working. Anything broken or partly working, describe it in the notes field at the end instead of checking it off.
- type: input
  id: version
  attributes:
    label: Add-on version
    placeholder: e.g. 2026.09.29.21.48
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    options:
    - Console (Xbox)
    - Console (PlayStation)
  validations:
    required: true
- type: checkboxes
  id: console_tests
  attributes:
    label: Console tests confirmed working
    options:
    - label: 'Window: Type /alcbench, then /alcbench again. Then open it and right-click it.'
    - label: 'ALL TEST: With Auto Lua Memory Cleaner''s Auto Lua Cleanup on, stand inside a house you own with Auto travel and Same place on, then pick Run Test > ALL TEST.'
    - label: 'ALC ONLY TEST: Pick Run Test > ALC ONLY TEST.'
    - label: 'VANILLA ONLY TEST: With Auto Lua Cleanup on, open Run Test. Then turn Auto Lua Cleanup off and pick VANILLA ONLY TEST.'
    - label: 'Loading Screen Test: Inside a house you own, open Run Test > LOADING SCREEN TEST, leave every side ticked, set Loads per side to 3 and Warm-up loads to 1, then press Start.'
    - label: 'Loading Screen Test sides: In the LOADING SCREEN TEST menu untick Vanilla, then leave only one side ticked, then untick every side.'
    - label: 'Loading Screen Test stop: Start a loading screen test and pick Stop the loading screen test in the menu. Start another and type /alcbench stop. Start a third and type /reloadui while it runs.'
    - label: 'Loading Screen Test outside a house: Leave your house and open the LOADING SCREEN TEST menu.'
    - label: 'Length and garbage: In the menu set Length to 30 and Extra garbage to 1 MB/s, then run ALC ONLY TEST.'
    - label: 'Real world and reload phases: In Advanced options turn Real world and Reload phases on, then run ALC ONLY TEST.'
    - label: 'Auto travel and Same place: Turn Auto travel off and run ALC ONLY TEST. Then turn it on and start the test outside a house you own.'
    - label: 'Saved tests: Under Saved tests, pick a test and use Show, Rename and Delete.'
    - label: 'Compare Test: With two tests of the same kind and length, tick one under Compare Test.'
    - label: 'Edited test: Close the game, change one number of a saved test in SavedVariables/ALCBenchmark.lua, start the game and show that test. Then delete its seal line and show it again.'
    - label: 'Test from another account: Copy a saved test into another account''s part of SavedVariables/ALCBenchmark.lua, log in with that account and show it.'
    - label: 'Pages: Switch between Results, Summary, Timeline and Loading Screens with the tabs, then /reloadui and open the window.'
    - label: 'Timeline: On the Timeline page hover a second, zoom in and out, and hide Lua in the legend (or under Timeline: show or hide).'
    - label: 'Memory display: Type /alcbench memory twice.'
    - label: 'Low memory protection: With Advanced Test on, set Fill Hold to pool 85 MB and run VANILLA ONLY TEST.'
    - label: 'Loading Screen Test garbage: Set Garbage before each load to 100 MB and start a loading screen test with Vanilla only.'
    - label: 'Fill: Type /alcbench fill 50.'
    - label: 'Status line: Run a test with Test status under the compass on, then turn it off.'
    - label: 'Cut-off test: During an ALL TEST, log out to the character screen, log back in and open the menu.'
    - label: 'Clear results: Pick Clear results in the menu, then type /alcbench clear.'
    - label: 'Help: Type /alcbench help.'
    - label: 'Controller: Press the Show or hide ALC Benchmark keybind, then the Control ALC Benchmark keybind, then LB, RB, the D-pad and the Options button.'
- type: textarea
  id: notes
  attributes:
    label: Anything broken, partly working, or not tested
    description: 'One line per issue: which test, what happened instead of Expected.'
    placeholder: 'e.g. PC-L-04 Bug report: popup opened but API version line was blank'
